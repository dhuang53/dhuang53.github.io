<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio</title>
<style>
:root{
  --bg:#fff; --surface:#fafafa; --surface-2:#f2f2f1;
  --line:#e4e4e2; --line-2:#d2d2cf;
  --text:#1a1a1a; --muted:#6b6b68; --faint:#96968f;
  --link:#2f5ce0; --danger:#b3261e;
  --vp:#f4f4f2;
  --sp:clamp(20px,5vw,40px);
  --r:6px;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font:400 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:920px;margin:0 auto;padding:0 var(--sp)}
a{color:inherit}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.hidden{display:none!important}

.disp{font-weight:600;letter-spacing:-.02em;line-height:1.15}
.mono{font-family:var(--mono)}
.lbl{font-size:13px;color:var(--muted)}

/* ---------- header ---------- */
.sheet{padding:clamp(40px,8vw,72px) 0 0}
h1.name{font-size:clamp(28px,5vw,38px);margin-bottom:8px}
.role{color:var(--muted);font-size:16px}
.tagline{margin-top:16px;max-width:60ch;color:#3a3a38}
.contact{margin-top:14px;font-size:15px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.contact a{color:var(--link);text-decoration:none}
.contact a:hover{text-decoration:underline}
.contact span{color:var(--line-2)}

/* ---------- toolbar ---------- */
.secbar{display:flex;align-items:center;gap:10px;margin:clamp(36px,6vw,56px) 0 18px;flex-wrap:wrap}
.secbar h2{font-size:19px;font-weight:600;letter-spacing:-.01em}
.secbar h2{margin-right:auto}
.secbar .fill{display:none}

/* ---------- buttons ---------- */
.btn{font:500 14px/1 var(--sans);padding:9px 14px;border:1px solid var(--line-2);background:var(--bg);
  color:var(--text);cursor:pointer;border-radius:var(--r);text-decoration:none;display:inline-flex;
  align-items:center;gap:7px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-2);border-color:var(--faint)}
.btn.pri{background:var(--text);border-color:var(--text);color:#fff}
.btn.pri:hover{background:#000;border-color:#000}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--text)}
.btn.danger{color:var(--danger);border-color:transparent}
.btn.danger:hover{background:#fdf2f1;border-color:transparent}
.btn[disabled]{opacity:.4;cursor:not-allowed}

/* ---------- project grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:clamp(16px,3vw,28px)}
.card{background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer;display:block;width:100%}
.card .view{aspect-ratio:4/3;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;position:relative;display:grid;place-items:center;transition:border-color .15s}
.card:hover .view{border-color:var(--faint)}
.card .view img{width:100%;height:100%;object-fit:cover;display:block}
.card .view .ph{color:var(--faint);font-size:13px}
.badge{position:absolute;bottom:8px;left:8px;background:rgba(255,255,255,.92);border:1px solid var(--line);
  color:var(--muted);font-size:11px;padding:2px 7px;border-radius:4px}
.card-body{padding:11px 2px 0}
.card-body h3{font-size:16px;font-weight:600;letter-spacing:-.01em;line-height:1.35;margin-bottom:3px}
.card-meta{font-size:13.5px;color:var(--muted)}

/* ---------- empty state ---------- */
.empty{border:1px solid var(--line);border-radius:var(--r);padding:clamp(28px,6vw,52px);text-align:center;background:var(--surface)}
.empty h3{font-size:19px;font-weight:600;margin-bottom:8px;letter-spacing:-.01em}
.empty p{color:var(--muted);max-width:48ch;margin:0 auto 20px;font-size:15px}
.empty .row{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}

/* ---------- detail ---------- */
.detail{padding-top:clamp(24px,5vw,40px)}
.crumb{display:flex;align-items:center;gap:10px;margin-bottom:22px;flex-wrap:wrap}
.crumb .lbl{margin-right:auto}
.detail h1{font-size:clamp(25px,4vw,32px);margin-bottom:10px}
.detail .summary{color:var(--muted);max-width:62ch}
.dcols{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(230px,1fr);gap:clamp(18px,3vw,32px);
  margin-top:clamp(24px,4vw,34px);align-items:start}
@media(max-width:820px){.dcols{grid-template-columns:1fr}}

/* ---------- 3D viewport ---------- */
.viewport{background:var(--vp);border:1px solid var(--line);border-radius:var(--r);position:relative;
  aspect-ratio:4/3;overflow:hidden}
.viewport canvas{display:block;width:100%;height:100%;touch-action:none}
.vp-tag{display:none}
.vp-hud{position:absolute;left:12px;bottom:10px;right:12px;display:flex;justify-content:space-between;gap:12px;
  font-size:12px;color:var(--muted);pointer-events:none;flex-wrap:wrap}
.vp-hud b{font-weight:500;color:var(--text)}
.vp-empty{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:12px;
  text-align:center;padding:24px}
.vp-empty p{font-size:14px;color:var(--muted);max-width:36ch;line-height:1.55}
.vp-empty .lbl{font-weight:500;color:var(--text)}
.vp-btn{font:500 13px/1 var(--sans);padding:8px 13px;border:1px solid var(--line-2);background:var(--bg);
  color:var(--text);border-radius:var(--r);cursor:pointer}
.vp-btn:hover{background:var(--surface-2)}
.vp-ctl{position:absolute;top:8px;right:8px;display:flex;gap:5px}
.vp-ctl button{font:500 12px/1 var(--sans);padding:6px 9px;background:rgba(255,255,255,.88);
  border:1px solid var(--line);color:var(--muted);border-radius:4px;cursor:pointer}
.vp-ctl button:hover{color:var(--text);border-color:var(--line-2)}
.vp-ctl button[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:#fff}

/* ---------- images ---------- */
.shot{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:14px}
.shot img{width:100%;display:block}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-top:8px}
.gal button{padding:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);
  aspect-ratio:4/3;overflow:hidden;cursor:pointer}
.gal button:hover{border-color:var(--faint)}
.gal img{width:100%;height:100%;object-fit:cover;display:block}

/* ---------- side panels ---------- */
.panel{border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
.panel-h{padding:9px 13px;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;gap:10px}
.panel-h .lbl{font-size:13px;font-weight:500;color:var(--text)}
.spec{width:100%;border-collapse:collapse;font-size:14px}
.spec tr+tr{border-top:1px solid var(--line)}
.spec th{text-align:left;padding:8px 13px;font-weight:400;color:var(--muted);width:44%;vertical-align:top;white-space:nowrap}
.spec td{padding:8px 13px;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:6px;padding:11px 13px;border-top:1px solid var(--line)}
.tag{font-size:12.5px;background:var(--surface-2);border-radius:4px;padding:3px 8px;color:var(--muted)}

/* ---------- files ---------- */
.files{list-style:none}
.files li+li{border-top:1px solid var(--line)}
.files a,.files .fi{display:flex;align-items:center;gap:10px;padding:10px 13px;text-decoration:none;color:inherit}
.files a:hover{background:var(--surface)}
.fkind{font-family:var(--mono);font-size:10.5px;color:var(--muted);background:var(--surface-2);
  border-radius:3px;padding:3px 5px;flex-shrink:0;min-width:46px;text-align:center}
.fkind.native{background:var(--text);color:#fff}
.fname{flex:1;min-width:0;font-size:14px;overflow-wrap:anywhere}
.fsize{font-size:12.5px;color:var(--faint);flex-shrink:0}

/* ---------- documentation ---------- */
.doc{max-width:68ch;margin-top:clamp(34px,6vw,52px)}
.doc .secbar h2{font-size:19px;font-weight:600;letter-spacing:-.01em;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:22px}
.doc-body{font-size:16px;line-height:1.7}
.doc-body>*+*{margin-top:1.05em}
.doc-body h1,.doc-body h2,.doc-body h3{font-weight:600;letter-spacing:-.01em;line-height:1.3;margin-top:1.9em}
.doc-body h1{font-size:1.35em}
.doc-body h2{font-size:1.15em}
.doc-body h3{font-size:1em}
.doc-body ul,.doc-body ol{padding-left:1.3em}
.doc-body li+li{margin-top:.3em}
.doc-body code{font-family:var(--mono);font-size:.86em;background:var(--surface-2);padding:1px 5px;border-radius:4px}
.doc-body pre{background:var(--surface-2);padding:13px 15px;border-radius:var(--r);overflow-x:auto;font-size:13.5px}
.doc-body pre code{background:none;padding:0}
.doc-body blockquote{border-left:2px solid var(--line-2);padding-left:15px;color:var(--muted)}
.doc-body hr{border:0;border-top:1px solid var(--line)}
.doc-body a{color:var(--link);text-underline-offset:3px}
.doc-body table{border-collapse:collapse;width:100%;font-size:14.5px}
.doc-body th,.doc-body td{border:1px solid var(--line);padding:7px 10px;text-align:left}
.doc-body th{background:var(--surface);font-weight:500}
.doc-empty{color:var(--faint)}

/* ---------- editor drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(26,26,26,.32);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--bg);z-index:50;
  border-left:1px solid var(--line);transform:translateX(100%);transition:transform .25s ease;
  display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer-h{padding:15px var(--sp);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;
  align-items:center;gap:14px;flex-shrink:0}
.drawer-h h2{font-size:17px;font-weight:600}
.drawer-b{overflow-y:auto;padding:22px var(--sp) 32px;flex:1}
.drawer-f{padding:12px var(--sp);border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;
  flex-shrink:0;flex-wrap:wrap}

.field{margin-bottom:18px}
.field>label{display:block;margin-bottom:6px;font-size:14px;font-weight:500;color:var(--text)}
.hint{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.5}
input[type=text],input[type=email],input[type=url],textarea,select{
  width:100%;padding:9px 11px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--bg);
  font:400 15px/1.5 var(--sans);color:var(--text)}
input:focus,textarea:focus{border-color:var(--text);outline:none}
textarea{resize:vertical;min-height:92px}
textarea.code{font-family:var(--mono);font-size:13.5px;line-height:1.65;min-height:300px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.two{grid-template-columns:1fr}}

.drop{border:1px dashed var(--line-2);border-radius:var(--r);padding:20px;text-align:center;background:var(--surface);
  cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--text);background:var(--surface-2)}
.drop .lbl{display:block;margin-bottom:5px;font-weight:500;color:var(--text);font-size:14px}
.drop p{font-size:13px;color:var(--muted);line-height:1.5}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:10px}
.thumbs figure{position:relative;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;aspect-ratio:1}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.x{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:4px;border:0;
  background:rgba(26,26,26,.72);color:#fff;font-size:13px;line-height:1;cursor:pointer;display:grid;place-items:center}
.x:hover{background:var(--danger)}
.chip{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:var(--r);
  padding:8px 10px;margin-top:8px;font-size:14px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:20px;flex-wrap:wrap}
.tabs button{font:500 14px/1 var(--sans);padding:9px 12px;background:none;border:0;border-bottom:2px solid transparent;
  cursor:pointer;color:var(--muted);margin-bottom:-1px}
.tabs button:hover{color:var(--text)}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--text)}
.note{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;
  font-size:13.5px;color:var(--muted);line-height:1.55;margin-bottom:20px}
.note code{font-family:var(--mono);font-size:.9em;background:var(--surface-2);padding:1px 4px;border-radius:3px}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,12px);background:var(--text);color:#fff;
  padding:11px 17px;border-radius:var(--r);font-size:14px;z-index:80;opacity:0;pointer-events:none;
  transition:.2s;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

.lb{position:fixed;inset:0;background:rgba(26,26,26,.9);z-index:70;display:none;place-items:center;padding:24px}
.lb.on{display:grid}
.lb img{max-width:100%;max-height:88vh;border-radius:var(--r)}
.lb button{position:absolute;top:18px;right:18px}

footer{margin:clamp(56px,9vw,96px) 0 0;border-top:1px solid var(--line);padding:16px 0 40px;
  display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--faint)}

@media print{ .no-print{display:none!important} }
@media(prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }

/* header contact row: JS emits bare <a>/<span> children */
.contact{display:flex;gap:14px;flex-wrap:wrap;align-items:baseline}
.contact>*+*{position:relative;padding-left:14px}
.contact>*+*::before{content:"·";position:absolute;left:0;color:var(--line-2)}
.contact>span{color:var(--muted)}

/* detail heading + documentation header */
.detail h1.disp{font-size:clamp(25px,4vw,32px);margin-bottom:10px}
.doc .secbar{margin:0 0 22px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.doc .secbar h2{font-size:19px}
.tags{border-top:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap">
  <div id="app"></div>
  <footer class="no-print">
    <span class="lbl" id="footL"></span>
    <span class="lbl" id="footR"></span>
  </footer>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
  <div class="drawer-h">
    <h2 id="drawerTitle">Edit</h2>
    <button class="btn ghost" id="drawerClose">Close</button>
  </div>
  <div class="drawer-b" id="drawerBody"></div>
  <div class="drawer-f" id="drawerFoot"></div>
</aside>

<div class="lb" id="lightbox"><button class="vp-btn" id="lbClose">Close</button><img alt="" id="lbImg"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script id="seed" type="application/json"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================
   Drawing Set — a portfolio for people who design physical things
   Single file. Data lives in this browser via window.storage,
   with JSON export/import for backup and deployment.
   ============================================================ */
(function(){
"use strict";

/* Captured before anything renders, so publishing reuses a clean copy of this
   page. Republishing from an already-published file works because the seed
   tag is replaced wholesale rather than appended to. */
const SHELL="<!DOCTYPE html>\n"+document.documentElement.outerHTML;
const SEED=(function(){
  const el=document.getElementById("seed");
  if(!el||!el.textContent.trim()) return null;
  try{ return JSON.parse(el.textContent); }catch(e){ return null; }
})();
let CAN_EDIT=true;

/* ---------------- small utilities ---------------- */
const $  = (s,r)=>(r||document).querySelector(s);
const $$ = (s,r)=>Array.from((r||document).querySelectorAll(s));
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad2 = n => String(n).padStart(2,"0");
function bytes(n){
  if(n==null) return "—";
  if(n<1024) return n+" B";
  if(n<1048576) return (n/1024).toFixed(0)+" KB";
  return (n/1048576).toFixed(n<10485760?1:0)+" MB";
}
let toastT;
function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),2600);
}
function toastHold(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toastT);
}
function abToB64(ab){
  let s="", u=new Uint8Array(ab), C=0x8000;
  for(let i=0;i<u.length;i+=C) s+=String.fromCharCode.apply(null,u.subarray(i,i+C));
  return btoa(s);
}
function b64ToAb(b64){
  const bin=atob(b64), u=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
  return u.buffer;
}
const b64Bytes = b64 => Math.floor((b64||"").length*3/4);

/* ---------------- persistence ----------------
   Two backends, picked automatically:
   · claude  — window.storage. 5 MB per key, so large files are split
               into chunks across many keys and rejoined on download.
   · idb     — IndexedDB, used when this file is self-hosted. Stores real
               Blobs with no base64 overhead; quota runs to disk size.
   Legacy records with inline `data` still load, so nothing breaks.
------------------------------------------------ */
const SITE_KEY="pf:site", PKEY=id=>"pf:proj:"+id, BKEY=(id,i)=>"pf:b:"+id+":"+i;
const CHUNK=3.4e6;        // base64 chars per key — safely under the 5 MB ceiling
const META_LIMIT=4.6e6;   // project metadata (text + images) must fit one key

const IDB={
  db:null,
  open(){
    if(this.db) return Promise.resolve(this.db);
    return new Promise((res,rej)=>{
      const r=indexedDB.open("drawing-set",1);
      r.onupgradeneeded=()=>{
        const d=r.result;
        if(!d.objectStoreNames.contains("kv")) d.createObjectStore("kv");
        if(!d.objectStoreNames.contains("blobs")) d.createObjectStore("blobs");
      };
      r.onsuccess=()=>{ this.db=r.result; res(r.result); };
      r.onerror=()=>rej(r.error);
    });
  },
  run(store,mode,fn){
    return this.open().then(db=>new Promise((res,rej)=>{
      const t=db.transaction(store,mode), req=fn(t.objectStore(store));
      t.oncomplete=()=>res(req?req.result:undefined);
      t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error);
    }));
  },
  get(k){ return this.run("kv","readonly",s=>s.get(k)); },
  set(k,v){ return this.run("kv","readwrite",s=>s.put(v,k)); },
  del(k){ return this.run("kv","readwrite",s=>s.delete(k)); },
  getBlob(k){ return this.run("blobs","readonly",s=>s.get(k)); },
  setBlob(k,b){ return this.run("blobs","readwrite",s=>s.put(b,k)); },
  delBlob(k){ return this.run("blobs","readwrite",s=>s.delete(k)); }
};

const Store={
  mode:"none",
  async init(){
    if(window.storage && typeof window.storage.get==="function"){ this.mode="claude"; return; }
    try{ if(window.indexedDB){ await IDB.open(); this.mode="idb"; return; } }catch(e){}
    this.mode="none";
  },
  get ok(){ return this.mode!=="none"; },
  async getKey(k){
    if(this.mode==="claude"){ const r=await window.storage.get(k); return r?r.value:null; }
    if(this.mode==="idb") return (await IDB.get(k))||null;
    return null;
  },
  async setKey(k,v){
    if(this.mode==="claude"){ await window.storage.set(k,v); return; }
    if(this.mode==="idb"){ await IDB.set(k,v); return; }
  },
  async delKey(k){
    try{
      if(this.mode==="claude") await window.storage.delete(k);
      else if(this.mode==="idb") await IDB.del(k);
    }catch(e){}
  },
  /* per-file ceiling, by backend */
  get maxFile(){ return this.mode==="idb" ? 250e6 : this.mode==="claude" ? 40e6 : 60e6; },
  get slowAbove(){ return this.mode==="claude" ? 8e6 : 80e6; }
};

/* blobs: large binaries kept outside the project record */
const memBlobs=new Map();
const Blobs={
  async put(ab,onProgress){
    const id=uid();
    memBlobs.set(id,ab);
    if(Store.mode==="idb"){
      await IDB.setBlob(id,new Blob([ab]));
      return {id,store:"idb",size:ab.byteLength};
    }
    if(Store.mode==="claude"){
      const b64=abToB64(ab), n=Math.max(1,Math.ceil(b64.length/CHUNK));
      for(let i=0;i<n;i++){
        onProgress&&onProgress(i,n);
        await window.storage.set(BKEY(id,i),b64.slice(i*CHUNK,(i+1)*CHUNK));
      }
      onProgress&&onProgress(n,n);
      return {id,store:"chunk",chunks:n,size:ab.byteLength};
    }
    return {id,store:"memory",size:ab.byteLength};
  },
  async get(rec){
    if(!rec) return null;
    if(rec.data) return b64ToAb(rec.data);                 // records written before chunking
    const b=rec.blob; if(!b) return null;
    if(memBlobs.has(b.id)) return memBlobs.get(b.id);
    let ab=null;
    if(b.store==="idb"){
      const blob=await IDB.getBlob(b.id);
      if(blob) ab=await blob.arrayBuffer();
    }else if(b.store==="chunk"){
      let s="";
      for(let i=0;i<b.chunks;i++){
        const v=await Store.getKey(BKEY(b.id,i));
        if(v==null) throw new Error("A piece of this file is missing from storage.");
        s+=v;
      }
      ab=b64ToAb(s);
    }
    if(ab) memBlobs.set(b.id,ab);
    return ab;
  },
  async del(rec){
    const b=rec&&rec.blob; if(!b) return;
    memBlobs.delete(b.id);
    if(b.store==="idb"){ try{ await IDB.delBlob(b.id); }catch(e){} }
    else if(b.store==="chunk"){ for(let i=0;i<b.chunks;i++) await Store.delKey(BKEY(b.id,i)); }
  }
};

/* ---------------- markdown (subset) ---------------- */
function md(src){
  if(!src||!src.trim()) return '<p class="doc-empty">No documentation yet.</p>';
  const blocks=[]; let text=esc(src).replace(/\r\n/g,"\n");
  text=text.replace(/```([\s\S]*?)```/g,(m,c)=>{blocks.push(c.replace(/^\n/,""));return "\u0000CODE"+(blocks.length-1)+"\u0000";});
  const lines=text.split("\n"); let out=[], list=null, para=[], tbl=null;

  const inline = s => s
    .replace(/`([^`]+)`/g,"<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');

  const flushP=()=>{ if(para.length){ out.push("<p>"+inline(para.join(" "))+"</p>"); para=[]; } };
  const flushL=()=>{ if(list){ out.push("<"+list.t+">"+list.items.map(i=>"<li>"+inline(i)+"</li>").join("")+"</"+list.t+">"); list=null; } };
  const flushT=()=>{
    if(!tbl) return;
    const cells=r=>r.replace(/^\||\|$/g,"").split("|").map(c=>inline(c.trim()));
    let h="<table>";
    if(tbl.length>1) h+="<thead><tr>"+cells(tbl[0]).map(c=>"<th>"+c+"</th>").join("")+"</tr></thead>";
    h+="<tbody>"+tbl.slice(1).map(r=>"<tr>"+cells(r).map(c=>"<td>"+c+"</td>").join("")+"</tr>").join("")+"</tbody></table>";
    out.push(h); tbl=null;
  };
  const flushAll=()=>{flushP();flushL();flushT();};

  for(let raw of lines){
    const line=raw.trimEnd();
    if(/^\s*\|.*\|\s*$/.test(line)){
      if(/^\s*\|[\s:|-]+\|\s*$/.test(line)) continue;   // separator row
      flushP(); flushL(); (tbl=tbl||[]).push(line.trim()); continue;
    } else if(tbl) flushT();

    if(!line.trim()){ flushAll(); continue; }
    let m;
    if((m=line.match(/^\u0000CODE(\d+)\u0000$/))){ flushAll(); out.push("<pre><code>"+blocks[+m[1]]+"</code></pre>"); continue; }
    if(/^(-{3,}|\*{3,})$/.test(line.trim())){ flushAll(); out.push("<hr>"); continue; }
    if((m=line.match(/^(#{1,4})\s+(.*)$/))){ flushAll(); const l=Math.min(m[1].length+1,4); out.push("<h"+l+">"+inline(m[2])+"</h"+l+">"); continue; }
    if((m=line.match(/^&gt;\s?(.*)$/))){ flushAll(); out.push("<blockquote>"+inline(m[1])+"</blockquote>"); continue; }
    if((m=line.match(/^\s*[-*+]\s+(.*)$/))){ flushP(); flushT(); if(!list||list.t!=="ul"){flushL();list={t:"ul",items:[]};} list.items.push(m[1]); continue; }
    if((m=line.match(/^\s*\d+[.)]\s+(.*)$/))){ flushP(); flushT(); if(!list||list.t!=="ol"){flushL();list={t:"ol",items:[]};} list.items.push(m[1]); continue; }
    flushL(); para.push(line.trim());
  }
  flushAll();
  return out.join("\n");
}

/* ---------------- STL parsing ---------------- */
function parseSTL(buffer){
  const view=new DataView(buffer);
  let binary=false;
  if(buffer.byteLength>=84){
    const n=view.getUint32(80,true);
    if(84+n*50===buffer.byteLength) binary=true;
  }
  let pos, nrm, tris;
  if(binary){
    tris=view.getUint32(80,true);
    pos=new Float32Array(tris*9); nrm=new Float32Array(tris*9);
    let o=84;
    for(let i=0;i<tris;i++){
      const nx=view.getFloat32(o,true), ny=view.getFloat32(o+4,true), nz=view.getFloat32(o+8,true);
      o+=12;
      for(let v=0;v<3;v++){
        const k=i*9+v*3;
        pos[k]=view.getFloat32(o,true); pos[k+1]=view.getFloat32(o+4,true); pos[k+2]=view.getFloat32(o+8,true);
        nrm[k]=nx; nrm[k+1]=ny; nrm[k+2]=nz;
        o+=12;
      }
      o+=2;
    }
  }else{
    const txt=new TextDecoder().decode(new Uint8Array(buffer));
    const verts=[], norms=[];
    const facetRe=/facet\s+normal\s+([-\d.eE+]+)\s+([-\d.eE+]+)\s+([-\d.eE+]+)([\s\S]*?)endfacet/g;
    const vertRe=/vertex\s+([-\d.eE+]+)\s+([-\d.eE+]+)\s+([-\d.eE+]+)/g;
    let f;
    while((f=facetRe.exec(txt))){
      const nx=+f[1],ny=+f[2],nz=+f[3]; let v,c=0; vertRe.lastIndex=0;
      while((v=vertRe.exec(f[4])) && c<3){ verts.push(+v[1],+v[2],+v[3]); norms.push(nx,ny,nz); c++; }
    }
    if(!verts.length) throw new Error("No triangles found — this file may not be an STL.");
    pos=new Float32Array(verts); nrm=new Float32Array(norms); tris=verts.length/9;
  }
  // bounds + signed volume
  let mnx=1/0,mny=1/0,mnz=1/0,mxx=-1/0,mxy=-1/0,mxz=-1/0,vol=0;
  for(let i=0;i<pos.length;i+=3){
    const x=pos[i],y=pos[i+1],z=pos[i+2];
    if(x<mnx)mnx=x; if(y<mny)mny=y; if(z<mnz)mnz=z;
    if(x>mxx)mxx=x; if(y>mxy)mxy=y; if(z>mxz)mxz=z;
  }
  for(let i=0;i<pos.length;i+=9){
    const ax=pos[i],ay=pos[i+1],az=pos[i+2],bx=pos[i+3],by=pos[i+4],bz=pos[i+5],cx=pos[i+6],cy=pos[i+7],cz=pos[i+8];
    vol += (ax*(by*cz-bz*cy) - ay*(bx*cz-bz*cx) + az*(bx*cy-by*cx))/6;
  }
  return {pos,nrm,tris,vol:Math.abs(vol),
    size:[mxx-mnx,mxy-mny,mxz-mnz], min:[mnx,mny,mnz], max:[mxx,mxy,mxz]};
}

/* ---------------- 3D viewport ---------------- */
const Viewer = {
  active:null,
  dispose(){
    const v=this.active; if(!v) return;
    cancelAnimationFrame(v.raf);
    if(v.ro) v.ro.disconnect();
    if(v.geo) v.geo.dispose();
    if(v.mat) v.mat.dispose();
    if(v.renderer){ v.renderer.dispose(); if(v.renderer.domElement.parentNode) v.renderer.domElement.parentNode.removeChild(v.renderer.domElement); }
    this.active=null;
  },
  mount(host, mesh, opts){
    this.dispose();
    if(typeof THREE==="undefined") throw new Error("3D library unavailable");
    const W=host.clientWidth||640, H=host.clientHeight||420;
    const scene=new THREE.Scene(); scene.background=new THREE.Color(0xF2F3F4);
    const cam=new THREE.PerspectiveCamera(38,W/H,.1,20000);
    const renderer=new THREE.WebGLRenderer({antialias:true});
    renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    renderer.setSize(W,H,false);
    if(THREE.sRGBEncoding) renderer.outputEncoding=THREE.sRGBEncoding;
    host.insertBefore(renderer.domElement,host.firstChild);

    const geo=new THREE.BufferGeometry();
    geo.setAttribute("position",new THREE.BufferAttribute(mesh.pos,3));
    geo.setAttribute("normal",new THREE.BufferAttribute(mesh.nrm,3));
    const R=Math.max(mesh.size[0],mesh.size[1],mesh.size[2])||1;
    const ctr=[(mesh.min[0]+mesh.max[0])/2,(mesh.min[1]+mesh.max[1])/2,(mesh.min[2]+mesh.max[2])/2];

    const mat=new THREE.MeshStandardMaterial({color:0x9AA1A6,metalness:.16,roughness:.58,side:THREE.DoubleSide});
    const obj=new THREE.Mesh(geo,mat);
    obj.position.set(-ctr[0],-ctr[1],-ctr[2]);
    const pivot=new THREE.Group(); pivot.add(obj); scene.add(pivot);

    const grid=new THREE.GridHelper(R*3, 24, 0xC2C7CB, 0xDDE1E3);
    grid.position.y=-(mesh.size[1]/2)-R*0.02; pivot.add(grid);

    scene.add(new THREE.HemisphereLight(0xffffff,0xBCC2C6,.88));
    const key=new THREE.DirectionalLight(0xffffff,.62); key.position.set(1,1.4,1.1); scene.add(key);
    const fill=new THREE.DirectionalLight(0xffffff,.28); fill.position.set(-1.2,-.4,-1); scene.add(fill);

    const st={az:Math.PI*.28, el:Math.PI*.17, dist:R*2.5, pan:new THREE.Vector3(), spin:!opts.reduced};
    function place(){
      const x=st.dist*Math.cos(st.el)*Math.sin(st.az);
      const y=st.dist*Math.sin(st.el);
      const z=st.dist*Math.cos(st.el)*Math.cos(st.az);
      cam.position.set(x+st.pan.x,y+st.pan.y,z+st.pan.z);
      cam.lookAt(st.pan);
    }
    place();

    // orbit / pan / zoom
    let drag=null;
    const el=renderer.domElement;
    el.addEventListener("pointerdown",e=>{
      el.setPointerCapture(e.pointerId);
      drag={x:e.clientX,y:e.clientY,pan:e.button===2||e.shiftKey};
      st.spin=false;
    });
    el.addEventListener("pointermove",e=>{
      if(!drag) return;
      const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
      drag.x=e.clientX; drag.y=e.clientY;
      if(drag.pan){
        const s=st.dist*.0016;
        const right=new THREE.Vector3().setFromMatrixColumn(cam.matrix,0).multiplyScalar(-dx*s);
        const up=new THREE.Vector3().setFromMatrixColumn(cam.matrix,1).multiplyScalar(dy*s);
        st.pan.add(right).add(up);
      }else{
        st.az-=dx*.0075;
        st.el=Math.max(-1.5,Math.min(1.5,st.el+dy*.0075));
      }
      place();
    });
    const stop=e=>{ if(drag){ try{el.releasePointerCapture(e.pointerId);}catch(_){} drag=null; } };
    el.addEventListener("pointerup",stop); el.addEventListener("pointercancel",stop);
    el.addEventListener("contextmenu",e=>e.preventDefault());
    el.addEventListener("wheel",e=>{
      e.preventDefault(); st.spin=false;
      st.dist=Math.max(R*.35,Math.min(R*14,st.dist*(1+Math.sign(e.deltaY)*.12)));
      place();
    },{passive:false});

    const ro=new ResizeObserver(()=>{
      const w=host.clientWidth,h=host.clientHeight;
      if(!w||!h) return;
      cam.aspect=w/h; cam.updateProjectionMatrix(); renderer.setSize(w,h,false);
    });
    ro.observe(host);

    const v={renderer,scene,cam,geo,mat,obj,grid,pivot,st,ro,raf:0,
      reset(){ st.az=Math.PI*.28; st.el=Math.PI*.17; st.dist=R*2.5; st.pan.set(0,0,0); place(); },
      setWire(on){ mat.wireframe=on; mat.needsUpdate=true; },
      setGrid(on){ grid.visible=on; },
      toggleSpin(){ st.spin=!st.spin; return st.spin; }
    };
    (function loop(){
      v.raf=requestAnimationFrame(loop);
      if(st.spin){ st.az+=.0035; place(); }
      renderer.render(scene,cam);
    })();
    this.active=v;
    return v;
  }
};

/* ---------------- demo geometry (an L-bracket, emitted as a real STL) ---------------- */
function demoSTL(){
  const tri=[];
  const box=(x0,y0,z0,x1,y1,z1)=>{
    const p=[[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0],[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]];
    [[0,3,2],[0,2,1],[4,5,6],[4,6,7],[0,4,7],[0,7,3],[1,2,6],[1,6,5],[0,1,5],[0,5,4],[3,7,6],[3,6,2]]
      .forEach(f=>tri.push([p[f[0]],p[f[1]],p[f[2]]]));
  };
  box(10,0,0, 96,10,64);       // base plate
  box(0,0,0, 10,72,64);        // upright
  const rib=(z)=>{             // gusset ribs
    const a=[[10,10,z],[46,10,z],[10,54,z]], b=a.map(v=>[v[0],v[1],z+6]);
    tri.push([a[0],a[2],a[1]],[b[0],b[1],b[2]]);
    [[0,1],[1,2],[2,0]].forEach(e=>{
      tri.push([a[e[0]],a[e[1]],b[e[1]]],[a[e[0]],b[e[1]],b[e[0]]]);
    });
  };
  rib(14); rib(44);
  const buf=new ArrayBuffer(84+tri.length*50), dv=new DataView(buf);
  dv.setUint32(80,tri.length,true);
  let o=84;
  tri.forEach(t=>{
    const u=[t[1][0]-t[0][0],t[1][1]-t[0][1],t[1][2]-t[0][2]];
    const w=[t[2][0]-t[0][0],t[2][1]-t[0][1],t[2][2]-t[0][2]];
    let n=[u[1]*w[2]-u[2]*w[1],u[2]*w[0]-u[0]*w[2],u[0]*w[1]-u[1]*w[0]];
    const L=Math.hypot(n[0],n[1],n[2])||1; n=n.map(c=>c/L);
    n.forEach((c,i)=>dv.setFloat32(o+i*4,c,true)); o+=12;
    t.forEach(v=>{ v.forEach((c,i)=>dv.setFloat32(o+i*4,c,true)); o+=12; });
    dv.setUint16(o,0,true); o+=2;
  });
  return buf;
}

const NATIVE_CAD=["sldprt","sldasm","slddrw","ipt","iam","idw","prt","asm","catpart","catproduct","f3d","f3z","x_t","x_b","sldlfp"];
const NEUTRAL=["step","stp","iges","igs","stl","3mf","obj","dxf","dwg","3dm","sat"];
function extOf(name){ const m=/\.([a-z0-9_]+)$/i.exec(name||""); return m?m[1].toLowerCase():""; }
function kindOf(name){
  const e=extOf(name);
  if(e==="sldprt") return {tag:"SLDPRT",native:true};
  if(e==="sldasm") return {tag:"SLDASM",native:true};
  if(e==="slddrw") return {tag:"SLDDRW",native:true};
  if(NATIVE_CAD.indexOf(e)>=0) return {tag:e.toUpperCase(),native:true};
  if(NEUTRAL.indexOf(e)>=0) return {tag:e.toUpperCase(),native:false};
  return {tag:(e||"FILE").toUpperCase().slice(0,6),native:false};
}

/* ---------------- image intake ---------------- */
function readImage(file,maxDim){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error("Couldn't read "+file.name));
    fr.onload=()=>{
      const img=new Image();
      img.onerror=()=>rej(new Error(file.name+" isn't an image this browser can open."));
      img.onload=()=>{
        const M=maxDim||1600;
        let w=img.naturalWidth,h=img.naturalHeight;
        if(Math.max(w,h)>M){ const k=M/Math.max(w,h); w=Math.round(w*k); h=Math.round(h*k); }
        const c=document.createElement("canvas"); c.width=w; c.height=h;
        const g=c.getContext("2d");
        g.fillStyle="#fff"; g.fillRect(0,0,w,h);
        g.drawImage(img,0,0,w,h);
        res(c.toDataURL("image/jpeg",0.82));
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
const readBuffer = file => new Promise((res,rej)=>{
  const fr=new FileReader();
  fr.onerror=()=>rej(new Error("Couldn't read "+file.name));
  fr.onload=()=>res(fr.result);
  fr.readAsArrayBuffer(file);
});

const meshCache=new Map();
async function startViewer(p){
  const host=$("#vp"); if(!host) return;
  const hud=$(".vp-hud",host);
  const fail=msg=>{
    host.innerHTML='<span class="vp-tag">Model viewer</span><div class="vp-empty"><span class="lbl">Cannot display</span><p>'
      + esc(msg)+" The file is still attached below for download.</p></div>";
  };
  try{
    let mesh=meshCache.get(p.id);
    if(!mesh){
      if(hud) hud.innerHTML="<span>Loading "+esc(p.model.name)+"…</span><span></span>";
      const ab=await Blobs.get(p.model);
      if(!ab) throw new Error("This model is no longer in storage.");
      mesh=parseSTL(ab);
      meshCache.set(p.id,mesh);
    }
    if(!document.body.contains(host)) return;   // navigated away while loading
    const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
    const v=Viewer.mount(host,mesh,{reduced});
    if(hud) hud.innerHTML='<span>'+esc(p.model.name)+"</span><span><b>"
      + mesh.size.map(x=>x.toFixed(1)).join(" × ")+" mm</b> · "+mesh.tris.toLocaleString()+" tri</span>";
    host.addEventListener("click",e=>{
      const b=e.target.closest("[data-vp]"); if(!b) return;
      const a=b.getAttribute("data-vp");
      if(a==="reset"){ v.reset(); }
      if(a==="wire"){ const on=b.getAttribute("aria-pressed")!=="true"; b.setAttribute("aria-pressed",on); v.setWire(on); }
      if(a==="grid"){ const on=b.getAttribute("aria-pressed")!=="true"; b.setAttribute("aria-pressed",on); v.setGrid(on); }
      if(a==="spin"){ b.setAttribute("aria-pressed",v.toggleSpin()); }
    });
  }catch(err){ fail(err.message||"This model could not be rendered."); }
}

async function storeBlob(ab,label){
  const big=ab.byteLength>Store.slowAbove;
  const rec=await Blobs.put(ab,(i,n)=>{
    if(n>1) toastHold("Storing "+label+" — part "+(i+1)+" of "+n);
    else if(big) toastHold("Storing "+label+"…");
  });
  ADDED.push({blob:rec});
  return rec;
}
function tooBig(f){
  if(f.size<=Store.maxFile) return false;
  toast('"'+f.name+'" is '+bytes(f.size)+". The ceiling here is "+bytes(Store.maxFile)+" — add it as a link instead.");
  return true;

async function takeModel(files){
  const f=files.find(x=>extOf(x.name)==="stl")||files[0];
  if(!f) return;
  if(extOf(f.name)!=="stl"){
    toast("The viewer reads STL. Add "+extOf(f.name).toUpperCase()+" under Files instead.");
    return;
  }
  if(tooBig(f)) return;
  try{
    toastHold("Reading "+f.name+"…");
    const buf=await readBuffer(f);
    const mesh=parseSTL(buf);
    if(EDIT.model) PEND_DEL.push(EDIT.model);
    const blob=await storeBlob(buf,f.name);
    EDIT.model={name:f.name,size:f.size,blob:blob,
      stats:{tris:mesh.tris,vol:mesh.vol,size:mesh.size}};
    paintModelChip(); paintFileList();
    toast(mesh.tris.toLocaleString()+" triangles loaded");
  }catch(e){ toast(e.message||"That STL could not be read."); }
}
async function takeImages(files){
  const imgs=files.filter(f=>/^image\//.test(f.type));
  if(!imgs.length){ toast("Those are not images — try the Files tab."); return; }

    try{ EDIT.images.push(await readImage(f,1600)); }
    catch(e){ toast(e.message); }
  }

async function takeFiles(files){
  for(const f of files){
    if(tooBig(f)) continue;
    try{
      toastHold("Reading "+f.name+"…");
      const buf=await readBuffer(f);
      const blob=await storeBlob(buf,f.name);
      EDIT.files.push({id:uid(),name:f.name,size:f.size,kind:"file",blob:blob});
      paintFileList();
    }catch(e){ toast(e.message||"Couldn't store "+f.name); }
  }
  toast("Attached");
}
function downloadBlob(name,ab,mime){
  const blob=new Blob([ab],{type:mime||"application/octet-stream"});
  const u=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=u; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},1200);
}

/* ---------------- backup ---------------- */
/* gather everything, with blob contents inlined as base64 */
async function collectData(){
  const projects=[];
  for(const id of State.order){
    const src=State.projects[id];
    const p=JSON.parse(JSON.stringify(src));
    if(src.model){
      const ab=await Blobs.get(src.model);
      if(ab){ p.model.data=abToB64(ab); delete p.model.blob; }
    }
    for(let i=0;i<(src.files||[]).length;i++){
      if(src.files[i].kind==="link") continue;
      const ab=await Blobs.get(src.files[i]);
      if(ab){ p.files[i].data=abToB64(ab); delete p.files[i].blob; }
    }
    projects.push(p);
  }
  return {format:"drawing-set",v:2,exported:new Date().toISOString(),owner:State.owner,projects};
}
const slug=()=>(State.owner.name||"portfolio").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");

async function exportJSON(){
  toastHold("Building backup…");
  let data;
  try{ data=await collectData(); }
  catch(e){ toast("Backup failed — some files could not be read."); return; }
  const json=JSON.stringify(data);
  downloadBlob(slug()+"-backup.json",new TextEncoder().encode(json),"application/json");
  toast("Backup downloaded — "+bytes(json.length));
}

/* Publish: writes index.html with your content baked in, ready to upload. */
async function publishSite(){
  toastHold("Building your site…");
  let data;
  try{ data=await collectData(); }
  catch(e){ toast("Publish failed — some files could not be read."); return; }
  const seed=JSON.stringify(data).replace(/</g,"\\u003c").replace(/\u2028|\u2029/g,"");
  const out=SHELL.replace(/(<script id="seed"[^>]*>)[\s\S]*?(<\/script>)/,(m,a,b)=>a+seed+b);
  if(out.indexOf(seed)<0){ toast("Couldn't write the site file."); return; }
  const size=new TextEncoder().encode(out).length;
  if(size>25e6 && !confirm("Your site file is "+bytes(size)+". That's a slow first load for visitors — "
    + "consider replacing big CAD attachments with links. Download anyway?")) return;
  downloadBlob("index.html",new TextEncoder().encode(out),"text/html");
  toast("index.html ready — "+bytes(size)+". Upload it to replace the old one.");
}
/* Write a full data set into storage, converting inlined base64 back into blobs.
   Used by Import, and when you open a published site with ?edit. */
async function adoptData(data){
  State.owner=Object.assign({name:"",title:"",tagline:"",location:"",email:"",link1:"",link2:""},data.owner||{});
  State.order=[]; State.projects={};
  for(const p of (data.projects||[])){
    if(!p||!p.id) continue;
    if(p.model&&p.model.data){
      p.model.blob=await Blobs.put(b64ToAb(p.model.data));
      delete p.model.data;
    }
    for(const f of (p.files||[])){
      if(f.data){ f.blob=await Blobs.put(b64ToAb(f.data)); delete f.data; }
    }
    State.projects[p.id]=p; State.order.push(p.id);
    await saveProject(p);
  }
  await saveSite();
}
async function importJSON(){
  const [f]=await pickFiles("application/json,.json",false);
  if(!f) return;
  try{
    const data=JSON.parse(await f.text());
    if(!data||!Array.isArray(data.projects)) throw new Error("bad");
    if(State.order.length && !confirm("Replace everything currently on this page with the backup?")) return;
    toastHold("Restoring…");
    for(const id of State.order.slice()) await deleteProject(id);
    await adoptData(data);
    location.hash=""; route();
    toast("Imported "+State.order.length+" projects");
  }catch(e){ toast("That file is not a Drawing Set backup."); }
}

/* ---------------- example project ---------------- */
async function loadDemo(){
  const buf=demoSTL(), mesh=parseSTL(buf);
  const blob=await Blobs.put(buf);
  const p=blankProject();
  Object.assign(p,{
    title:"Gusseted mounting bracket",
    summary:"Load-bearing bracket that carries a 12 kg sensor head off an extrusion frame, redesigned from a welded steel part to a single machined billet.",
    material:"6061-T6 aluminium",process:"3-axis CNC, bead blast + clear anodise",rev:"C",year:"2026",
    tags:["Bracket","FEA","DFM","Weight reduction"],
    model:{name:"bracket-rev-c.stl",size:buf.byteLength,blob:blob,
      stats:{tris:mesh.tris,vol:mesh.vol,size:mesh.size}},
    doc:"## Overview\n\nThe sensor head on our test rig hung off a welded steel bracket that arrived warped often enough that we were shimming one in three. I replaced it with a machined aluminium part that holds flatness without post-processing.\n\n"
      + "## Requirements\n\n| Requirement | Target | Result |\n| --- | --- | --- |\n| Mass | < 350 g | 299 g |\n| Tip deflection at 12 kg | < 0.5 mm | 0.31 mm |\n| Mounting face flatness | 0.1 mm | 0.04 mm measured |\n| Unit cost at qty 50 | < $85 | $71 |\n\n"
      + "## Design decisions\n\n- Two gussets rather than one thick web: same stiffness, 22 % less material, and both faces reachable with a 12 mm end mill so there is no tool change.\n- Aluminium over steel because the deflection budget was met with room to spare and the weld distortion was the real failure mode.\n- Slots instead of holes on the frame face, so the sensor can be trimmed ±4 mm during calibration.\n\n"
      + "## Analysis and testing\n\nHand calc first, treating the upright as a cantilever, which put deflection near 0.4 mm. FEA with a bonded frame face and a 120 N load at the tip gave 0.31 mm and showed the peak stress at the gusset root, 88 MPa against a 276 MPa yield.\n\nA dial indicator on the first article read 0.29 mm under the real sensor head, which was close enough to trust the model for the next revision.\n\n"
      + "## Manufacturing\n\nOne setup for the base and slots, a second for the upright face. The gusset fillets are 6 mm so a standard tool clears them. Rev C added a 0.5 mm relief at the inside corner after the machinist pointed out we were asking for a sharp internal edge.\n\n"
      + "## What I would change\n\nThe slots let the part be assembled 2 mm out of position without anyone noticing until calibration. A dowel pin and one slot would have been the better call, and it is what I would do next time."
  });
  State.projects[p.id]=p; State.order.push(p.id);
  await saveProject(p); await saveSite();
  if(!State.owner.name){
    State.owner.name="Your name";
    State.owner.title="Mechanical design engineer";
    State.owner.tagline="Replace this text and the example project with your own work. Everything on this page is editable.";
    await saveSite();
  }
  route(); toast("Example loaded — edit or delete it");
}

/* ---------------- events ---------------- */
document.addEventListener("click",async e=>{
  const dl=e.target.closest("[data-dl]");
  if(dl){
    e.preventDefault();
    const id=dl.getAttribute("data-dl"), p=State.projects[currentId()];
    if(!p) return;
    const rec = id==="__model" ? p.model : (p.files||[]).find(x=>x.id===id);
    if(!rec) return;
    try{
      toastHold("Assembling "+rec.name+"…");
      const ab=await Blobs.get(rec);
      if(!ab) throw new Error("This file is no longer in storage.");
      downloadBlob(rec.name,ab,id==="__model"?"model/stl":"application/octet-stream");
      toast("Downloaded "+rec.name);
    }catch(err){ toast(err.message||"Couldn't rebuild that file."); }
    return;
  }
  const img=e.target.closest("[data-img]");
  if(img){
    const p=State.projects[currentId()];
    if(p){ $("#lbImg").src=p.images[+img.getAttribute("data-img")]; $("#lightbox").classList.add("on"); }
    return;
  }
  const go=e.target.closest("[data-go]");
  if(go){ location.hash="#/p/"+go.getAttribute("data-go"); return; }

  const tab=e.target.closest(".tabs [data-tab]");
  if(tab){ collectFields(); TAB=tab.getAttribute("data-tab"); drawEditor(); return; }

  const drop=e.target.closest("[data-drop]");
  if(drop){
    const w=drop.getAttribute("data-drop");
    if(w==="model") takeModel(await pickFiles(".stl",false));
    if(w==="images") takeImages(await pickFiles("image/*",true));
    if(w==="files") takeFiles(await pickFiles("",true));
    return;
  }
  const rmi=e.target.closest("[data-rmimg]");
  if(rmi){ EDIT.images.splice(+rmi.getAttribute("data-rmimg"),1); paintThumbs(); paintFileList(); return; }
  const rmf=e.target.closest("[data-rmfile]");
  if(rmf){
    const id=rmf.getAttribute("data-rmfile");
    const rec=(EDIT.files||[]).find(x=>x.id===id);
    if(rec) PEND_DEL.push(rec);
    EDIT.files=EDIT.files.filter(x=>x.id!==id);
    paintFileList(); return;
  }
  if(e.target.closest('[data-rm="model"]')){
    if(EDIT.model) PEND_DEL.push(EDIT.model);
    EDIT.model=null; paintModelChip(); paintFileList(); return;
  }

  const act=e.target.closest("[data-act]");
  if(!act) return;
  const a=act.getAttribute("data-act");
  if(a==="home"){ location.hash=""; }
  if(a==="new"){ editProject(null); }
  if(a==="demo"){ loadDemo(); }
  if(a==="edit"){ editProject(act.getAttribute("data-id"),act.getAttribute("data-tab")); }
  if(a==="edit-owner"){ editOwner(); }
  if(a==="save-owner"){ saveOwner(); }
  if(a==="save-project"){ saveProjectFromEditor(); }
  if(a==="delete"){ removeProject(); }
  if(a==="export"){ exportJSON(); }
  if(a==="publish"){ publishSite(); }
  if(a==="import"){ importJSON(); }
  if(a==="add-link"){
    const n=$("#lnk_name"), u=$("#lnk_url");
    if(!u.value.trim()){ toast("Paste the link first"); u.focus(); return; }
    EDIT.files.push({id:uid(),name:n.value.trim()||u.value.trim(),url:u.value.trim(),kind:"link"});
    n.value=""; u.value=""; paintFileList();
  }
});

/* drag and drop onto zones */
["dragenter","dragover"].forEach(ev=>document.addEventListener(ev,e=>{
  const d=e.target.closest&&e.target.closest("[data-drop]");
  if(d){ e.preventDefault(); d.classList.add("over"); }
}));
document.addEventListener("dragleave",e=>{
  const d=e.target.closest&&e.target.closest("[data-drop]");
  if(d) d.classList.remove("over");
});
document.addEventListener("drop",e=>{
  const d=e.target.closest&&e.target.closest("[data-drop]");
  if(!d) return;
  e.preventDefault(); d.classList.remove("over");
  const files=Array.from(e.dataTransfer.files||[]);
  const w=d.getAttribute("data-drop");
  if(w==="model") takeModel(files);
  if(w==="images") takeImages(files);
  if(w==="files") takeFiles(files);
});

$("#drawerClose").addEventListener("click",()=>{ collectFields(); Drawer.close(); discardEditor(); });
$("#scrim").addEventListener("click",()=>{ collectFields(); Drawer.close(); discardEditor(); });
$("#lbClose").addEventListener("click",()=>$("#lightbox").classList.remove("on"));
$("#lightbox").addEventListener("click",e=>{ if(e.target.id==="lightbox") $("#lightbox").classList.remove("on"); });
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    if($("#lightbox").classList.contains("on")) $("#lightbox").classList.remove("on");
    else if(Drawer.isOpen()){ collectFields(); Drawer.close(); discardEditor(); }
  }
});

/* ---------------- routing ---------------- */
function currentId(){ const m=/^#\/p\/(.+)$/.exec(location.hash); return m?m[1]:null; }
function route(){
  const id=currentId();
  if(id&&State.projects[id]) renderDetail(id); else renderHome();
}
window.addEventListener("hashchange",route);

/* ---------------- boot ---------------- */
(async function(){
  $("#app").innerHTML='<div style="padding:80px 0"><span class="lbl">Loading…</span></div>';
  await loadAll();

  /* A published file carries its content inline. Anyone without their own
     saved copy — every visitor — reads that instead, in view-only mode.
     With ?edit, the published content is written into this browser's storage
     first, so editing one project can't strand the others. */
  if(SEED && !State.order.length){
    CAN_EDIT=/[?&#]edit\b/.test(location.search+location.hash);
    if(CAN_EDIT && Store.ok){
      try{
        $("#app").innerHTML='<div style="padding:80px 0"><span class="lbl">Setting up your working copy…</span></div>';
        await adoptData(JSON.parse(JSON.stringify(SEED)));
        toast("Editing here now. Publish when you're done, then upload the new file.");
      }catch(e){ toast("Couldn't set up editing — work from your local copy instead."); }
    }else{
      State.owner=Object.assign(State.owner,SEED.owner||{});
      (SEED.projects||[]).forEach(p=>{ if(p&&p.id){ State.projects[p.id]=p; State.order.push(p.id); } });
    }
  }else if(!Store.ok){
    toast("Storage unavailable here — use Export backup to keep your work");
  }
  route();
})();

})();


</script>
